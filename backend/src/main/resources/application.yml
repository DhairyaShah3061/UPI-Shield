spring:
  application:
    name: upi-shield

  datasource:
    url: jdbc:postgresql://localhost:5432/upishield
    username: upishield
    password: upishield_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-256-bits!!}
    expiration-ms: 86400000
  hashing:
    secret: ${HASHING_SECRET:upi-shield-default-hmac-sha256-secret-key-32bytes-min!!}
  reputation:
    cache-ttl-minutes: 30
  url-analyzer:
    redirect-timeout-ms: 3000
    max-redirects: 5
  risk:
    safe-max: 29
    suspicious-max: 64
    score-cap: 100

